# Configure API Server port
server:
  port: 8081

spring:
  application:
    name: Backend-API
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  datasource:
    hikari:
      maximum-pool-size: 10
    url: jdbc:mariadb://localhost:3306/github?useUnicode=true&characterEncoding=utf8mb4&connectionCollation=utf8mb4_unicode_ci
    username: root
    password: nini69
    driver-class-name: org.mariadb.jdbc.Driver

# Enabling Swagger Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

implType:
  # if true, API will use hardcoded SQL queries & JDBC to fetch results
  # else if false, API will use CriteriaBuilder & JPA for database operations
  useSqlQueries: ${SQL_IMPLEMENTATION_TYPE}

logging:
  level:
    root: WARN
    org.bootcamp.com: DEBUG
    org.springframework: INFO