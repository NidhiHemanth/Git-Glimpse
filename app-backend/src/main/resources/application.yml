# Configure API Server port
server:
  port: 8081

spring:
  application:
    name: Backend-API
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  datasource:
    hikari:
      maximum-pool-size: 10
    url: jdbc:mariadb://localhost:3306/github?useUnicode=true&characterEncoding=utf8mb4&connectionCollation=utf8mb4_unicode_ci
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

# Configuring Spring Actuator
# (Check health of the application at http://localhost:8081/actuator/health)
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

# Enabling Swagger Documentation
# http://localhost:8081/swagger-ui/index.html
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

impl-type:
  # if true, API will use hardcoded SQL queries & JDBC to fetch results
  # else if false, API will use CriteriaBuilder & JPA for database operations
  useSqlQueries: ${SQL_IMPLEMENTATION_TYPE}

logging:
  level:
    root: WARN
    org.bootcamp.com: DEBUG
    org.springframework: INFO

github:
  api:
    token: ${GITHUB_API_TOKEN:}