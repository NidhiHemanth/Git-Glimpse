# Hibernate, JDBC & SQL configurations
spring:
  application:
    name: BatchProcessing
  jpa:
    # Dialect is a class that tells Hibernate how to speak the SQL "language" of your database
    # Hibernate uses dialect resolution (version >= 3.2) to automatically determine the target database and dialect to be used
    hibernate:
      # Standard Hibernate property values are - none, validate, update, create, create-drop
      ddl-auto: update
    show-sql: false
  datasource:
    hikari:
      # Hikari is a high-performance, lightweight connection pooling library
      # It provides a pool of pre-established database connections,
      # eliminating the overhead of creating a new connection each time the application needs one
      maximum-pool-size: 10
    url: jdbc:mariadb://localhost:3306/github?useUnicode=true&characterEncoding=utf8mb4&connectionCollation=utf8mb4_unicode_ci
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  batch:
    job:
      # Disable the initial job execution.
      # By default, Spring runs the job after the context startup with empty parameters
      enabled: false
    jdbc:
      initialize-schema: ALWAYS

# Logging levels configuration
logging:
  level:
    root: WARN
    org.bootcamp.com: DEBUG
    org.springframework: INFO
    org.hibernate: ERROR
    org.hibernate.SQL: ERROR
    org.hibernate.type: TRACE

ref:
  inputDir: ${INPUT_DIR}